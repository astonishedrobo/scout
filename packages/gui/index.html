<!DOCTYPE html>
<html lang="en" class="soft">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scout — AI Data Research Agent</title>
    <script>
      // Avoid FOUC: apply saved theme before paint. Default for new users is soft gray.
      (function () {
        var saved = localStorage.getItem("scout-theme");
        var theme = saved === "light" || saved === "soft" || saved === "dark" ? saved : "soft";
        document.documentElement.classList.remove("dark", "soft", "light");
        document.documentElement.classList.add(theme);
      })();
    </script>
  </head>
  <body class="bg-scout-canvas text-scout-text font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
