[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scout-agent"
version = "0.1.0"
description = "A generic data research agent framework with LLM-powered analysis"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "litellm>=1.0",
    "rank-bm25>=0.2.2",
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "langgraph>=0.5",
    "langchain>=0.3",
    "langchain-litellm>=0.2",
    "langsmith>=0.1.95",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "uv>=0.5",
    "sse-starlette>=2.0",
    "pyjwt>=2.8",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pillow>=10.0",
]

[project.optional-dependencies]
docling = ["docling>=2.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/scout"]
