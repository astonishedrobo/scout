# Operator-managed deployment defaults. Secrets belong in Docker secrets or .env.
agent:
  model: openai/gpt-5-mini
  temperature: 0.2
  max_iterations: 25
  code_timeout: 30

memories:
  use_memories: true
  generate_memories: true
  stage1_max_jobs_per_startup: 4
  stage1_concurrency: 4

retriever:
  top_k: 5
  chunk_size: 1000
  chunk_overlap: 200
  max_index_bytes: 25000000
  max_chunks: 20000
  max_resident_users: 4
  idle_ttl_seconds: 900
  build_concurrency: 1

server:
  max_live_sessions: 24
  max_live_sessions_per_user: 8
  session_idle_ttl_seconds: 1800
  session_eviction_grace_seconds: 5
  agent_init_concurrency: 2
  agent_init_timeout_seconds: 45
  maintenance_interval_seconds: 60

execution:
  enabled: true
  backend: worker
  isolation: container
  require_isolation: true
  network_default: deny

skills:
  defer_loading: true

permissions:
  allow_request_permissions: true

hooks:
  enabled: true

session_titles:
  enabled: true
  timeout_seconds: 60
  max_attempts: 2

llm:
  providers:
    groq:
      models:
        - groq/llama-3.1-8b-instant
        - groq/llama-3.3-70b-versatile
        - groq/openai/gpt-oss-20b
    openai:
      models:
        - openai/gpt-5-mini
    anthropic:
      models: []
